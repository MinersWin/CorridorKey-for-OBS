name: Format
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==19.1.7 gersemi==0.22.2
      - name: Check C and C++
        shell: bash
        run: git ls-files -z '*.cpp' '*.hpp' '*.c' '*.h' | xargs -0 -r clang-format --dry-run --Werror
      - name: Check CMake
        shell: bash
        run: git ls-files -z '*CMakeLists.txt' '*.cmake' | xargs -0 -r gersemi --check
