name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tag against buildspec
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re
          version = json.load(open('buildspec.json', encoding='utf-8-sig'))['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Expected a numeric semantic version'
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag and buildspec version differ'
          PY
  build:
    needs: version
    uses: ./.github/workflows/build.yml
  windows-package:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x64-baseline-stage
          path: stage
      - name: Package zip and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content buildspec.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path stage/corridorkey -DestinationPath "release/corridorkey-$version-windows-x64.zip"
          New-Item -ItemType Directory -Force stage_legacy/corridorkey/bin/64bit | Out-Null
          Copy-Item -LiteralPath stage/corridorkey/data -Destination stage_legacy/corridorkey/data -Recurse
          Copy-Item -Path stage/corridorkey/*.dll -Destination stage_legacy/corridorkey/bin/64bit
          Copy-Item -Path stage/corridorkey/*.pdb -Destination stage_legacy/corridorkey/bin/64bit -ErrorAction SilentlyContinue
          Compress-Archive -Path stage_legacy/corridorkey -DestinationPath "release/corridorkey-$version-windows-x64-legacy.zip"
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler was not found' }
          & $compiler.FullName "/DPluginVersion=$version" "/DStageDir=$PWD\stage\corridorkey" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-packages
          path: release/*
          if-no-files-found: error
  linux-package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ubuntu-x86_64-stage
          path: stage
      - name: Package deb and tarball
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("buildspec.json", encoding="utf-8-sig"))["version"])')
          mkdir -p release
          tar -C stage -cJf "release/corridorkey-$version-ubuntu-24.04-x86_64.tar.xz" usr
          mkdir -p stage/DEBIAN
          cat > stage/DEBIAN/control <<EOF
          Package: obs-corridorkey
          Version: $version
          Architecture: amd64
          Maintainer: Moritz Mantel <admin@moritz-mantel.de>
          Depends: obs-studio (>= 30.2), libc6 (>= 2.38), libstdc++6 (>= 13.1), libqt6widgets6t64 (>= 6.4)
          Section: video
          Priority: optional
          Homepage: https://github.com/MinersWin/CorridorKey-for-OBS
          Description: CorridorKey video filter for OBS Studio
           Pre-alpha pass-through foundation; no models or inference are included.
          EOF
          find stage -type d -exec chmod 755 {} +
          find stage -type f -exec chmod 644 {} +
          dpkg-deb --root-owner-group --build stage "release/corridorkey-$version-ubuntu-24.04-amd64.deb"
          dpkg-deb --info release/*.deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-packages
          path: release/*
          if-no-files-found: error
  publish:
    needs: [windows-package, linux-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-packages'
          merge-multiple: true
          path: release
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum ./* > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./* --verify-tag --draft --prerelease \
            --title "CorridorKey $RELEASE_TAG" \
            --notes 'Pre-alpha pass-through foundation. No inference engine or models are included. Install only with OBS Studio closed. Use the modern Windows zip for OBS 33+, or the legacy zip for OBS 30.2-32; the installer selects one layout. Ubuntu 24.04 packages target compatible OBS 30.2-32 installations. See the README compatibility matrix and report problems through GitHub issues.'
