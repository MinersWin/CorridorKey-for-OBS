Status.Help="Rechenzeit ist die Zeit pro Key. Filterverzögerung ist das Alter des erfassten Eingangs bei der Anzeige, nicht die Kamera- oder Encoderlatenz. Details werden beim Öffnen oder Ändern aktualisiert."
Status.Dropped="Verworfene Bilder"
Status.Repeated="Wiederholte Ausgabe"
Status.NotMeasured="Nicht gemessen"
Availability.Help="Nicht verfügbar: Keine geprüfte Implementierung oder passende installierte Modellvariante wurde gemeldet. Gespeicherte Werte bleiben erhalten."
CropPreview.Label="Zuschnitt prüfen"
CropPreview.Help="Eine Zuschnittansicht verändert die Stream-Ausgabe. Eine vorübergehende Vorschau fehlt, bis der Renderer sie an die Lebensdauer der Eigenschaften binden kann. Ansicht → Zuschnitt nur für eine beabsichtigte Ausgabeänderung wählen."
Delay.Help="Mittleres Alter vom erfassten Filtereingang bis zur Anzeige. Kamera- und Encoderverzögerung sind nicht enthalten."
Applied.Help="Vom zuständigen Filter ergänzte Audioverzögerung. Erst messbar, wenn die Audiosynchronisierung aktiv ist."
Tile.Info="Kachelkern: 32 px (v12)"
Tile.Help="Das installierte Modell legt Kern, Rand und Stapelform fest. v12 nutzt einen Kern von 32 Pixeln, 10 Pixel Rand und die obere Alpha-Bandgrenze 0,996."
ResetMemory.Label="Gedächtnis leeren"
ResetMemory.Help="Zeitlichen Zustand, Geometriespeicher, Motivverfolgung und vorherige Hilfsmasken leeren."
ResetQuality.Label="Qualität zurücksetzen"
ResetQuality.Help="Gewähltes Profil wiederherstellen; Eigene wird Ausgewogen. Zuschnitt, Audiozuordnung und Kontrollansicht bleiben erhalten."
Diagnostics.Label="Diagnose..."
Diagnostics.Help="Backend-Ergebnisse und Zeitmessungen zeigen. Die vollständige Diagnoseansicht fehlt noch."
Diagnostics.Placeholder="Die Backend-Diagnose fehlt noch. Startfehler stehen im OBS-Protokoll."
Migration.Help="Hinweise zu übernommenen Prototyp-Einstellungen. Werte werden einmal migriert und mit einer Schemaversion gespeichert."
Migration.Newer="Diese Einstellungen stammen aus einer neueren Version. Bekannte Felder wurden geladen; unbekannte bleiben gespeichert."
Migration.Grid="Ein altes Arbeitsraster wurde übernommen. Es kann erst mit installierter Modellvariante laufen."
Migration.Inspection="Der importierte Kontrollhintergrund wurde auf Transparent gesetzt. Kontrollansichten ausdrücklich wählen."
Migration.Audio="Zugehöriges Mikrofon erneut wählen. Alte Quellennamen sind keine sicheren dauerhaften Audio-IDs."
Migration.Cradio="C-RADIO war im Prototyp aktiv. Es wird nicht mehr unterstützt und bleibt aus."
Migration.Refiner="Ein unbekannter Verfeinerer-Pfad wurde durch die Paketauswahl v12 ersetzt. Geprüfte Modelle über die Modellverwaltung importieren."
Migration.Tiles="Unbegrenzte Kacheln sind im Live-Betrieb nicht verfügbar. Das Budget wurde auf 64 begrenzt; einen installierten festen Stapel wählen."
