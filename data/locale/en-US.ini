Module.Description="Neural keying for OBS Studio. Development build; model setup is not available yet."
Filter.Name="CorridorKey"
profile.Label="Preset"
profile.Help="Start with Balanced. Facecam 60 prioritizes speed; Quality adds a detail stage. Editing quality selects Custom."
model_id.Label="Model"
model_id.Help="Each pipeline saves its own quality settings. CK1 is experimental; edge quality is clearly below CK2. For a weak GPU, try CK2 Facecam with Edge refiner off."
model_revision.Label="Model revision"
model_revision.Help="Verified model revision retained with saved settings."
backend.Label="Backend"
backend.Help="Auto uses a backend that passes compatibility checks. CPU is an explicit diagnostic choice, never an automatic live fallback."
device.Label="GPU"
device.Help="Prefer the OBS adapter. Another GPU can require slower transfer. Only probed adapters are offered."
target_fps.Label="Key rate"
target_fps.Help="Accepted frames per second, capped by the OBS rate. Zero follows OBS; output rendering keeps its normal rate."
grid.Label="Grid"
grid.Help="Working height × width, separate from source size. Only installed static graph variants can run."
roi_enabled.Label="Subject crop"
roi_enabled.Help="Focus CK2 on the foreground inside your manual crop."
stage2_interval.Label="Detail interval"
stage2_interval.Help="Off uses Stage 1. Every frame adds Stage 2. Expert intervals 2–4 reuse detail and may leave trails."
refiner_max_tiles.Label="Tile budget"
refiner_max_tiles.Help="More native-resolution edge tiles can improve hair but take longer. Only installed fixed batches can run; zero/all-tiles is not a live mode."
roi_padding.Label="ROI margin"
roi_padding.Help="Margin around the automatic foreground box; leave room for moving hands and hair."
use_rvm_temporal.Label="Video memory"
use_rvm_temporal.Help="Use previous frames for temporal features. Reset after cuts or source changes."
refiner_enabled.Label="Edge refiner"
refiner_enabled.Help="Recover edges from native pixels. Requires a compatible refiner model and transfer path. CK1 needs an evaluated experimental package."
guide_mode.Label="Edge method"
guide_mode.Help="RGB guided is the fallback if refinement is unavailable. Bilinear reveals the model detail limit. Chroma legacy is experimental."
refiner_model.Label="Refiner"
refiner_model.Help="Use an installed compatible model: v12 is the reference; older versions are for comparison. Arbitrary checkpoint paths are not accepted."
guided_radius.Label="Hair radius"
guided_radius.Help="Guided-filter neighborhood in low-grid pixels. Larger values can smooth detail."
guided_eps.Label="Edge smoothness"
guided_eps.Help="Stored as exact epsilon; the UI uses log10 from −5 to −2. Larger values smooth more. Default 0.0005."
alpha_contrast.Label="Matte contrast"
alpha_contrast.Help="Increase separation around mid-opacity. Too much removes translucent detail."
alpha_offset.Label="Matte choke"
alpha_offset.Help="Negative shrinks opacity; positive expands it. Check hair and motion blur."
clip_black.Label="Black point"
clip_black.Help="Alpha at or below this becomes transparent. White point must be at least 0.01 higher."
clip_white.Label="White point"
clip_white.Help="Alpha at or above this becomes solid. Keep at least 0.01 above Black point."
refiner_band_lo.Label="Band minimum"
refiner_band_lo.Help="Lowest alpha considered for edge refinement. Raising it can lose faint hair."
refiner_band_gain.Label="Band gain"
refiner_band_gain.Help="Higher positive gain allows more weight at low alpha. Zero disables weighting."
unmix_mode.Label="Colour method"
unmix_mode.Help="Delta transfers model colour correction onto native detail. Compositing equation is experimental."
unmix_inner.Label="Interior colour"
unmix_inner.Help="Model colour correction in solid areas. Edges retain full correction."
despill_strength.Label="Despill"
despill_strength.Help="Remove green spill after refinement. Reduce if neutral or coloured details shift."
screen_color.Label="Screen"
screen_color.Help="CK1 uses a separate blue-screen checkpoint. CK2 v12 presets are evaluated for green."
cut_left.Label="Left"
cut_left.Help="Cut from the left before inference. Outside pixels become transparent."
cut_right.Label="Right"
cut_right.Help="Remove room edges from the right. Source output size stays unchanged."
cut_top.Label="Top"
cut_top.Help="Cut from the top; leave space for hair and movement."
cut_bottom.Label="Bottom"
cut_bottom.Help="Cut from the bottom before inference; the output canvas stays unchanged."
hint_source.Label="Hint source"
hint_source.Help="MODNet is the default person hint and may remove props or chairs. CK2 Stage 1 adds MoGe, RVM and Stage 1 at 512x512 on each capture; its time is included in inference. Chroma is Expert-only and fails on teal or unevenly lit screens. Selecting a hint never downloads a model."
hint_similarity.Label="Screen match"
hint_similarity.Help="Chroma similarity used to seed background. Calibration is provisional; inspect Hint output."
hint_smoothness.Label="Hint softness"
hint_smoothness.Help="Width of the chroma transition, not final matte sharpness."
hint_refresh.Label="Hint rate"
hint_refresh.Help="Every CK1 hint runs on its own captured frame. Reusing an older hint is disabled."
hint_mask.Label="Mask source"
hint_mask.Help="Only a validated full-frame linear mask aligned with this frame and crop; source cycles must be rejected."
hint_mode.Label="Hint mode"
hint_mode.Help="CK2 hints are experimental. Measured profiles use Off."
temporal_hint_quality.Label="Previous hint"
temporal_hint_quality.Help="Trust in previous alpha. Zero disables it; high values can leave trails."
chroma_hint_quality.Label="Chroma trust"
chroma_hint_quality.Help="Trust in the experimental CK2 chroma hint; not a native CK1 input."
external_hint_quality.Label="Mask trust"
external_hint_quality.Help="High confidence can make CK2 copy the rough mask."
external_hint_soft.Label="Mask blur"
external_hint_soft.Help="Box-blur the external guide twice, in inference pixels. This does not blur final alpha."
obs_view.Label="View"
obs_view.Help="Inspection replaces output and may appear on stream or recording. Crop sliders never enable a view automatically."
view_mode.Label="Inspect"
view_mode.Help="Transparent is normal Key output. Other backgrounds and Side by side explicitly change output."
bg_color_rgb.Label="Preview colour"
bg_color_rgb.Help="Inspection background only; normal Key output remains transparent."
bypass.Label="Bypass"
bypass.Help="Show original input and stop inference submissions."
auto_sync.Label="Auto lip-sync"
auto_sync.Help="Add measured filter delay to one explicitly selected microphone. Other latency may still need correction."
audio_source_id.Label="Audio source"
audio_source_id.Help="Choose the paired microphone by persistent ID. One filter may own its offset; manual changes release ownership."
sync_trim_ms.Label="Sync trim"
sync_trim_ms.Help="Extra correction after measured delay. Negative values cannot make already-delayed audio arrive earlier. Verify with a clap recording."
sync_limit_ms.Label="Delay limit"
sync_limit_ms.Help="Maximum added audio delay. Large values cannot fix a backend that falls behind."
stale_timeout_ms.Label="Stale limit"
stale_timeout_ms.Help="Return to live input if no fresh keyed result arrives in this time."
guided_scale.Label="Guide scale"
guided_scale.Help="Reduce legacy guided pass resolution only on supported paths. Refiner sampling remains native."
aspect_fix.Label="Keep aspect"
aspect_fix.Help="Preserve source proportions in the grid. May change measured preset results."
moge_interval.Label="Geometry rate"
moge_interval.Help="Refresh geometry every N accepted frames, or sooner when motion exceeds the threshold."
moge_motion_threshold.Label="Motion limit"
moge_motion_threshold.Help="Mean RGB change of a 32×32 thumbnail triggering geometry refresh. Lower values refresh more often."
roi_smoothing.Label="ROI smoothing"
roi_smoothing.Help="Higher values move the automatic crop more slowly."
stagger_s1_s2.Label="Alternate stages"
stagger_s1_s2.Help="Experimental alternating stages. The prototype flickered; not recommended for streaming. Requires a declared graph capability."
precision.Label="Precision"
precision.Help="Only graph/backend-validated precision is offered. Lower precision is not always faster."
transport.Label="Transfer"
transport.Help="Interop keeps pixels on GPU. Staged paths can add delay and require a successful capability test."
head_pass.Label="Head detail"
head_pass.Help="Experimental second Stage-1 pass with separate model state. Requires an installed supported graph; adds work."
head_size.Label="Head grid"
head_size.Help="Installed static height/width for the separate head pass."
head_max_tiles.Label="Head tiles"
head_max_tiles.Help="Installed fixed refiner tile budget for the head pass."
head_min_gain.Label="Min. head gain"
head_min_gain.Help="Only run if head sampling improves by at least this factor."
