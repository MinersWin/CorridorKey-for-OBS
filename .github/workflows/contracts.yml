# SPDX-License-Identifier: GPL-3.0-or-later
name: Contracts
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure without OBS or optional inference runtimes
        run: cmake -S . -B build-contracts -DCORRIDORKEY_BUILD_PLUGIN=OFF -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build-contracts --config RelWithDebInfo --parallel 4
      - name: Test
        run: ctest --test-dir build-contracts -C RelWithDebInfo --output-on-failure
      - name: Install graph fixture tooling
        run: python -m pip install onnx==1.17.0
      - name: Generate and check independent external-data graph
        run: python tools/generate-test-graph.py build-contracts/fixtures
