name: Format
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==19.1.7 gersemi==0.22.2
      - name: Check C and C++
        shell: bash
        run: git ls-files -z '*.cpp' '*.hpp' '*.c' '*.h' | xargs -0 -r clang-format --dry-run --Werror
      - name: Check CMake
        shell: bash
        run: git ls-files -z '*CMakeLists.txt' '*.cmake' | xargs -0 -r gersemi --check
