Advanced.Label="Erweitert"
Advanced.Help="Weitere Einstellungen zeigen. Änderungen können die Verzögerung erhöhen."
Expert.Label="Experte"
Expert.Help="Experimente und Backend-Einstellungen zeigen. Nicht unterstützte Optionen bleiben gesperrt."
Details.Label="Details zeigen"
Details.Help="Diese Gruppe öffnen, ohne Bildeinstellungen zu ändern."
Models.Manage="Modelle verwalten..."
Models.Help="Modelle installieren, aktualisieren, importieren oder entfernen und das Backend testen. Die Modellverwaltung fehlt in diesem Entwicklungsstand."
Models.Placeholder="Modelle lassen sich in diesem Entwicklungsstand noch nicht einrichten. Video wird durchgereicht; es wird kein Modell heruntergeladen."
