Module.Description="Neuronales Keying für OBS Studio. Entwicklungsstand; Modelle lassen sich noch nicht einrichten."
Filter.Name="CorridorKey"
profile.Label="Profil"
profile.Help="Mit Ausgewogen beginnen. Facecam 60 spart Rechenzeit, Qualität ergänzt eine Detailstufe. Änderungen wählen Eigene."
model_id.Label="Modell"
model_id.Help="Pipeline wählen. Jede behält ihre Qualitätseinstellungen und benötigt eigene Modelle."
model_revision.Label="Modellstand"
model_revision.Help="Geprüfter Modellstand der gespeicherten Einstellungen."
backend.Label="Backend"
backend.Help="Auto nutzt ein geprüftes Backend. CPU dient nur der ausdrücklich gewählten Diagnose, nie als automatische Live-Ausweichlösung."
device.Label="GPU"
device.Help="Möglichst die OBS-GPU nutzen. Eine andere GPU kann langsamere Übertragung erfordern. Nur geprüfte Geräte sind verfügbar."
target_fps.Label="Key-Rate"
target_fps.Help="Verarbeitete Bilder pro Sekunde, höchstens die OBS-Bildrate. Null folgt OBS; die Ausgabe behält ihre Bildrate."
grid.Label="Raster"
grid.Help="Arbeitshöhe × Breite, unabhängig von der Quellgröße. Nur installierte statische Modellvarianten können laufen."
roi_enabled.Label="Motivzuschnitt"
roi_enabled.Help="CK2 auf den Vordergrund innerhalb des manuellen Zuschnitts konzentrieren."
stage2_interval.Label="Detailabstand"
stage2_interval.Help="Aus nutzt Stufe 1. Jedes Bild ergänzt Stufe 2. Expertenabstände 2–4 verwenden Details erneut und können Spuren hinterlassen."
refiner_max_tiles.Label="Kachelbudget"
refiner_max_tiles.Help="Mehr Kacheln in Originalauflösung können Haare verbessern, brauchen aber länger. Nur installierte feste Stapel sind nutzbar; null/alle ist kein Live-Modus."
roi_padding.Label="Motivrand"
roi_padding.Help="Rand um das automatisch erkannte Motiv; Platz für bewegte Hände und Haare lassen."
use_rvm_temporal.Label="Bildgedächtnis"
use_rvm_temporal.Help="Vorherige Bilder für zeitliche Merkmale nutzen. Nach Schnitten oder Quellenwechsel zurücksetzen."
refiner_enabled.Label="Kanten verfeinern"
refiner_enabled.Help="Kanten aus Originalpixeln gewinnen. Benötigt ein passendes Modell und einen geeigneten Übertragungsweg. CK1 braucht ein geprüftes experimentelles Paket."
guide_mode.Label="Kantenmethode"
guide_mode.Help="RGB-geführt dient als Ausweichmethode. Bilinear zeigt die Detailgrenze des Modells. Chroma alt ist experimentell."
refiner_model.Label="Verfeinerer"
refiner_model.Help="Ein installiertes passendes Modell nutzen: v12 ist die Referenz, ältere Versionen dienen dem Vergleich. Freie Checkpoint-Pfade sind nicht zulässig."
guided_radius.Label="Haarradius"
guided_radius.Help="Nachbarschaft des geführten Filters in Rasterpixeln. Größere Werte können Details glätten."
guided_eps.Label="Kantenglättung"
guided_eps.Help="Als genaues Epsilon gespeichert; die Anzeige nutzt log10 von −5 bis −2. Größere Werte glätten stärker. Standard: 0,0005."
alpha_contrast.Label="Maskenkontrast"
alpha_contrast.Help="Trennung bei mittlerer Deckkraft verstärken. Zu viel entfernt durchscheinende Details."
alpha_offset.Label="Maskenversatz"
alpha_offset.Help="Negative Werte verkleinern die Deckkraft, positive erweitern sie. Haare und Bewegungsunschärfe prüfen."
clip_black.Label="Schwarzpunkt"
clip_black.Help="Alpha bis zu diesem Wert wird durchsichtig. Der Weißpunkt muss mindestens 0,01 höher liegen."
clip_white.Label="Weißpunkt"
clip_white.Help="Alpha ab diesem Wert wird deckend. Mindestens 0,01 Abstand zum Schwarzpunkt halten."
refiner_band_lo.Label="Bandminimum"
refiner_band_lo.Help="Niedrigstes Alpha für die Kantenverfeinerung. Höhere Werte können feine Haare verlieren."
refiner_band_gain.Label="Bandverstärkung"
refiner_band_gain.Help="Höhere positive Werte erlauben mehr Gewicht bei niedrigem Alpha. Null schaltet die Gewichtung aus."
unmix_mode.Label="Farbmethode"
unmix_mode.Help="Delta überträgt die Farbkorrektur des Modells auf Originaldetails. Die Compositing-Gleichung ist experimentell."
unmix_inner.Label="Innenfarbe"
unmix_inner.Help="Farbkorrektur des Modells in deckenden Flächen. Kanten behalten die volle Korrektur."
despill_strength.Label="Entfärbung"
despill_strength.Help="Grünen Farbschein nach der Verfeinerung entfernen. Verringern, wenn neutrale oder farbige Details kippen."
screen_color.Label="Hintergrund"
screen_color.Help="CK1 benötigt für Blau einen eigenen Checkpoint. CK2-v12-Profile sind für Grün geprüft."
cut_left.Label="Links"
cut_left.Help="Links vor der Verarbeitung abschneiden. Außenliegende Pixel werden durchsichtig."
cut_right.Label="Rechts"
cut_right.Help="Raumränder rechts entfernen. Die Ausgabegröße bleibt gleich."
cut_top.Label="Oben"
cut_top.Help="Oben abschneiden; Platz für Haare und Bewegung lassen."
cut_bottom.Label="Unten"
cut_bottom.Help="Unten vor der Verarbeitung abschneiden; die Ausgabefläche bleibt gleich."
hint_source.Label="Maskenhilfe"
hint_source.Help="Chroma ist sparsam. CK2-Stufe 1 benötigt ihre Abhängigkeiten. Personenmodelle wie MODNet können Requisiten oder Stühle auslassen. Die Auswahl lädt kein Modell herunter."
hint_similarity.Label="Farbähnlichkeit"
hint_similarity.Help="Chroma-Ähnlichkeit zur Hintergrundschätzung. Vorläufige Kalibrierung; Ausgabe Hilfsmaske prüfen."
hint_smoothness.Label="Hilfsmaskenrand"
hint_smoothness.Help="Breite des Chroma-Übergangs, nicht die Schärfe der fertigen Maske."
hint_refresh.Label="Hilfsmaskentakt"
hint_refresh.Help="Alle N angenommenen Bilder erneuern. Wiederverwendung kann bei Bewegung verzögern."
hint_mask.Label="Maskenquelle"
hint_mask.Help="Nur eine geprüfte lineare Vollbildmaske passend zu Bild und Zuschnitt; Quellenschleifen müssen abgelehnt werden."
hint_mode.Label="Hilfsmaskenmodus"
hint_mode.Help="CK2-Hilfsmasken sind experimentell. Geprüfte Profile nutzen Aus."
temporal_hint_quality.Label="Vorherige Maske"
temporal_hint_quality.Help="Vertrauen in vorheriges Alpha. Null schaltet es aus; hohe Werte können Spuren hinterlassen."
chroma_hint_quality.Label="Chroma-Vertrauen"
chroma_hint_quality.Help="Vertrauen in die experimentelle CK2-Chroma-Hilfe; kein nativer CK1-Eingang."
external_hint_quality.Label="Maskenvertrauen"
external_hint_quality.Help="Hohes Vertrauen kann CK2 dazu bringen, die grobe Maske zu kopieren."
external_hint_soft.Label="Maskenweichheit"
external_hint_soft.Help="Die externe Hilfsmaske zweimal mit einem Boxfilter glätten, in Rasterpixeln. Das fertige Alpha wird nicht weichgezeichnet."
obs_view.Label="Ansicht"
obs_view.Help="Die Kontrollansicht ersetzt die Ausgabe und kann im Stream oder in Aufnahmen erscheinen. Zuschnittregler aktivieren sie nie automatisch."
view_mode.Label="Kontrolle"
view_mode.Help="Transparent ist die normale Key-Ausgabe. Andere Hintergründe und Nebeneinander verändern die Ausgabe ausdrücklich."
bg_color_rgb.Label="Kontrollfarbe"
bg_color_rgb.Help="Nur Kontrollhintergrund; die normale Key-Ausgabe bleibt transparent."
bypass.Label="Durchreichen"
bypass.Help="Originaleingang anzeigen und keine neuen Bilder zur Verarbeitung einreichen."
auto_sync.Label="Auto-Lippensync"
auto_sync.Help="Gemessene Filterverzögerung zu einem ausdrücklich gewählten Mikrofon addieren. Andere Latenz kann weitere Korrektur brauchen."
audio_source_id.Label="Audioquelle"
audio_source_id.Help="Zugehöriges Mikrofon über seine dauerhafte ID wählen. Nur ein Filter darf den Versatz steuern; manuelle Änderungen beenden die Steuerung."
sync_trim_ms.Label="Sync-Korrektur"
sync_trim_ms.Help="Zusätzliche Korrektur nach der gemessenen Verzögerung. Negative Werte holen bereits verspäteten Ton nicht zurück. Mit einer Klatschaufnahme prüfen."
sync_limit_ms.Label="Verzögerungslimit"
sync_limit_ms.Help="Maximale zusätzliche Audioverzögerung. Große Werte beheben kein zu langsames Backend."
stale_timeout_ms.Label="Altersgrenze"
stale_timeout_ms.Help="Live-Eingang durchreichen, wenn innerhalb dieser Zeit kein frisches Key-Ergebnis eintrifft."
guided_scale.Label="Führungsgröße"
guided_scale.Help="Auflösung des alten geführten Durchlaufs nur auf unterstützten Pfaden verringern. Verfeinerung tastet weiterhin Originalpixel ab."
aspect_fix.Label="Seitenverhältnis"
aspect_fix.Help="Seitenverhältnis der Quelle im Raster erhalten. Kann Ergebnisse der gemessenen Profile ändern."
moge_interval.Label="Geometrietakt"
moge_interval.Help="Geometrie alle N angenommenen Bilder erneuern; bei starker Bewegung früher."
moge_motion_threshold.Label="Bewegungsgrenze"
moge_motion_threshold.Help="Mittlere RGB-Änderung eines 32×32-Vorschaubilds, die Geometrie erneuert. Niedrige Werte erneuern häufiger."
roi_smoothing.Label="Motivglättung"
roi_smoothing.Help="Höhere Werte bewegen den automatischen Zuschnitt langsamer."
stagger_s1_s2.Label="Stufen abwechseln"
stagger_s1_s2.Help="Experimenteller Stufenwechsel. Der Prototyp flackerte; für Streams nicht empfohlen. Benötigt ausdrücklich unterstützte Modelle."
precision.Label="Genauigkeit"
precision.Help="Nur für Modell und Backend geprüfte Genauigkeit wählen. Weniger Genauigkeit ist nicht immer schneller."
transport.Label="Übertragung"
transport.Help="Interop hält Pixel auf der GPU. Zwischengespeicherte Übertragung kann verzögern und benötigt einen erfolgreichen Funktionstest."
head_pass.Label="Kopfdetails"
head_pass.Help="Experimenteller zweiter Durchlauf von Stufe 1 mit eigenem Modellzustand. Benötigt ein passendes installiertes Modell und zusätzliche Rechenzeit."
head_size.Label="Kopfraster"
head_size.Help="Installierte statische Höhe/Breite des separaten Kopfdurchlaufs."
head_max_tiles.Label="Kopfkacheln"
head_max_tiles.Help="Installiertes festes Kachelbudget zur Verfeinerung des Kopfdurchlaufs."
head_min_gain.Label="Min. Kopfgewinn"
head_min_gain.Help="Nur ausführen, wenn die Abtastung des Kopfes mindestens um diesen Faktor feiner wird."
