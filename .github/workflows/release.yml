# SPDX-License-Identifier: GPL-3.0-or-later
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a draft for an existing version tag (false only builds artifacts)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      signed: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-test.') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tag against buildspec
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json, os, re
          version = json.load(open('buildspec.json', encoding='utf-8-sig'))['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          ref = os.environ['RELEASE_REF']
          if ref.startswith('refs/tags/'):
              tag = ref.removeprefix('refs/tags/')
              assert re.fullmatch('v' + re.escape(version) + r'(?:-(?:rc|test)\.[0-9]+)?', tag), 'Tag and buildspec differ'
          PY
  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      package_stages: true
      signed_catalogue: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-test.') }}
  catalogue-signing:
    needs: [version, build]
    if: needs.version.outputs.signed == 'true'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install signing tooling
        run: python -m pip install -r tools/requirements-signing.txt
      - name: Sign and verify the exact catalogue bytes
        env:
          CATALOGUE_SIGNING_KEY: ${{ secrets.CATALOGUE_SIGNING_KEY }}
        run: |
          mkdir signed-catalogue
          python tools/sign-catalogue.py --signature signed-catalogue/catalogue-signature.json
          cp data/models/catalogue-v1.json signed-catalogue/catalogue-v1.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-catalogue
          path: signed-catalogue/
          if-no-files-found: error
          retention-days: 1
  windows-package:
    needs: [version, build, catalogue-signing]
    if: always() && !cancelled() && needs.build.result == 'success' && (needs.catalogue-signing.result == 'success' || (needs.version.outputs.signed == 'false' && needs.catalogue-signing.result == 'skipped'))
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-baseline-stage
          path: stage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.version.outputs.signed == 'true'
        with:
          name: signed-catalogue
          path: signed-catalogue
      - name: Complete catalogue payload
        shell: pwsh
        env:
          SIGNED_CATALOGUE: ${{ needs.version.outputs.signed }}
        run: |
          python -m pip install -r tools/requirements-signing.txt
          if ($LASTEXITCODE -ne 0) { throw 'Signing tooling installation failed' }
          if ($env:SIGNED_CATALOGUE -eq 'true') {
            python tools/stage-catalogue.py stage/corridorkey/data/models --signed-dir signed-catalogue
          } else {
            python tools/stage-catalogue.py stage/corridorkey/data/models --unsigned-test
          }
          if ($LASTEXITCODE -ne 0) { throw 'Catalogue stage verification failed' }
      - name: Package native runtime, notices and zips
        run: |
          python -m pip install onnx==1.19.1
          python packaging/package.py --platform windows-x64
      - name: Build unsigned installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content buildspec.json -Raw | ConvertFrom-Json).version
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_5_4/innosetup-6.5.4.exe' -OutFile inno.exe
          if ((Get-FileHash inno.exe -Algorithm SHA256).Hash -ne 'fa73bf47a4da250d185d07561c2bfda387e5e20db77e4570004cf6a133cc10b1') { throw 'Inno checksum mismatch' }
          $process = Start-Process -FilePath ./inno.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=$PWD/inno" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno installation failed' }
          & ./inno/ISCC.exe "/DPluginVersion=$version" "/DStageDir=$PWD/stage/corridorkey" "/DOutputPath=$PWD/release" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          Copy-Item stage/corridorkey/data/THIRD_PARTY_NOTICES.md release/THIRD_PARTY_NOTICES-windows-x64.md
          Copy-Item stage/corridorkey/data/BUNDLE_CONTENTS.json release/BUNDLE_CONTENTS-windows-x64.json
          python packaging/package.py --checksums-only
      - name: Label unsigned test artifacts
        if: needs.version.outputs.signed != 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('release').iterdir():
              if path.is_file() and path.name != 'SHA256SUMS.txt':
                  path.rename(path.with_name('unsigned-test-' + path.name))
          PY
          python packaging/package.py --checksums-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-packages${{ needs.version.outputs.signed != 'true' && '-unsigned-test' || '' }}
          path: release/*
          if-no-files-found: error
          retention-days: 1
  linux-package:
    needs: [version, build, catalogue-signing]
    if: always() && !cancelled() && needs.build.result == 'success' && (needs.catalogue-signing.result == 'success' || (needs.version.outputs.signed == 'false' && needs.catalogue-signing.result == 'skipped'))
    runs-on: ubuntu-${{ matrix.distro }}
    strategy:
      matrix:
        distro: ['24.04', '26.04']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ubuntu-${{ matrix.distro }}-x86_64-stage
          path: stage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.version.outputs.signed == 'true'
        with:
          name: signed-catalogue
          path: signed-catalogue
      - name: Install packaging dependencies
        # Runtime library names differ between releases (t64 transition), so pick whichever exists.
        run: |
          sudo apt-get update
          pick() { for name in "$@"; do apt-cache policy "$name" | grep -q "Candidate: [0-9]" && { echo "$name"; return; }; done; echo "$1"; }
          sudo apt-get install -y dpkg-dev libobs-dev python3-venv \
            "$(pick libqt6widgets6t64 libqt6widgets6)" "$(pick libcurl4t64 libcurl4)"
      - name: Package native runtime, notices, deb and tarball
        env:
          SIGNED_CATALOGUE: ${{ needs.version.outputs.signed }}
        run: |
          python3 -m venv .venv
          .venv/bin/pip install onnx==1.19.1
          .venv/bin/pip install -r tools/requirements-signing.txt
          if [ "$SIGNED_CATALOGUE" = 'true' ]; then
            .venv/bin/python tools/stage-catalogue.py stage/usr/share/obs/obs-plugins/corridorkey/models --signed-dir signed-catalogue
          else
            .venv/bin/python tools/stage-catalogue.py stage/usr/share/obs/obs-plugins/corridorkey/models --unsigned-test
          fi
          .venv/bin/python packaging/package.py --platform linux-x86_64 --distro '${{ matrix.distro }}'
          dpkg-deb --info release/*.deb
          dpkg-deb --contents release/*.deb
          cp stage/usr/share/obs/obs-plugins/corridorkey/THIRD_PARTY_NOTICES.md release/THIRD_PARTY_NOTICES-ubuntu-${{ matrix.distro }}.md
          cp stage/usr/share/obs/obs-plugins/corridorkey/BUNDLE_CONTENTS.json release/BUNDLE_CONTENTS-ubuntu-${{ matrix.distro }}.json
      - name: Label unsigned test artifacts
        if: needs.version.outputs.signed != 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('release').iterdir():
              if path.is_file() and path.name != 'SHA256SUMS.txt':
                  path.rename(path.with_name('unsigned-test-' + path.name))
          PY
          python3 packaging/package.py --checksums-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.distro }}-packages${{ needs.version.outputs.signed != 'true' && '-unsigned-test' || '' }}
          path: release/*
          if-no-files-found: error
          retention-days: 1
  draft:
    needs: [windows-package, linux-package, catalogue-signing]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-test.') && (github.event_name == 'push' || inputs.create_draft)
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-packages'
          merge-multiple: true
          path: release
      - name: Verify asset limits and calculate final checksums
        run: python3 packaging/package.py --checksums-only
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --prerelease \
            --title "CorridorKey $RELEASE_TAG" --notes-file packaging/release-notes.md
