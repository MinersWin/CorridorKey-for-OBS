name: Catalogue signing tests
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  throwaway-key:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install signing test dependencies
        run: python -m pip install -r tools/requirements-signing.txt
      - name: Install native verifier dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev zlib1g-dev nlohmann-json3-dev
      - name: Configure the native verifier and signing tests
        run: cmake -S . -B build-signing -DCORRIDORKEY_BUILD_PLUGIN=OFF -DCORRIDORKEY_TEST_CATALOGUE_SIGNING=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build native verifier
        run: cmake --build build-signing --config RelWithDebInfo --target corridorkey_catalogue_verify --parallel 4
      - name: Sign with throwaway keys and verify through the runtime parser
        run: ctest --test-dir build-signing -C RelWithDebInfo --output-on-failure -R '^catalogue_signing$'
