# SPDX-License-Identifier: GPL-3.0-or-later
name: Build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure
        run: cmake --preset windows-ci-x64
      - name: Build
        run: cmake --build --preset windows-ci-x64 --parallel 4
      - name: Stage
        run: cmake --install build_x64 --config RelWithDebInfo --prefix stage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-stage
          path: stage/
          if-no-files-found: error
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install SDK build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            python3 qt6-base-dev extra-cmake-modules libsimde-dev uthash-dev \
            libjansson-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xinput-dev \
            libdrm-dev libegl1-mesa-dev libgl1-mesa-dev libglib2.0-dev uuid-dev zlib1g-dev
      - name: Build pinned OBS SDK
        run: python3 tools/bootstrap-linux-sdk.py
      - name: Configure
        run: cmake --preset ubuntu-ci-x86_64 -DCMAKE_PREFIX_PATH="$PWD/.deps/linux-sdk"
      - name: Build
        run: cmake --build --preset ubuntu-ci-x86_64 --parallel 4
      - name: Stage
        run: DESTDIR="$PWD/stage" cmake --install build_x86_64 --prefix /usr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ubuntu-x86_64-stage
          path: stage/
          if-no-files-found: error
