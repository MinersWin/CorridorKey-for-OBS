Applied.Help="Audio delay added by the owning filter. Not measured until audio-sync support is active."
Tile.Info="Tile center: 32 px (v12)"
Tile.Help="The installed graph defines center, halo and batch shape. v12 uses a 32-pixel center, 10-pixel halo and upper alpha band 0.996."
